<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>dietitianos</title>
    <script type="text/javascript">
      // GitHub Pages SPA fallback: github.com/rafgraph/spa-github-pages
      // Redirects a deep-link 404 back to index.html so React Router
      // (and Supabase auth callback tokens) can be handled client-side.
      var pathSegmentsToKeep = 1; // keeps "/dietitianos"
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
